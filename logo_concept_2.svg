<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
  <!-- Concept 2: "Cluster Snap" — Proxmox hex badge, cluster nodes, snapshot ring -->

  <!-- Hexagonal badge (pointy-top, Proxmox visual language), orange -->
  <path d="M 166 126 L 100 164 L 34 126 L 34 50 L 100 12 L 166 50 Z" fill="#E57000"/>

  <!-- Cluster interconnect lines (PVE nodes connected) -->
  <line x1="100" y1="52" x2="72" y2="116" stroke="white" stroke-width="2.5" opacity="0.45"/>
  <line x1="100" y1="52" x2="128" y2="116" stroke="white" stroke-width="2.5" opacity="0.45"/>
  <line x1="72"  y1="116" x2="128" y2="116" stroke="white" stroke-width="2.5" opacity="0.45"/>

  <!-- Snapshot ring around cluster — center (100,94), radius 48 -->
  <!-- Arc from SVG 130° to 50° clockwise (280° arc, gap at bottom) -->
  <!-- 130°: x=100+48*cos130°=69.1, y=94+48*sin130°=130.8 -->
  <!-- 50°:  x=100+48*cos50°=130.9, y=94+48*sin50°=130.8 -->
  <path d="M 69 131 A 48 48 0 1 1 131 131"
        fill="none" stroke="white" stroke-width="5" stroke-linecap="round" opacity="0.88"/>
  <!-- Arrowhead at (131,131): clockwise tangent at 50° = direction 140° -->
  <!-- Wings: (140,129) and (134,122) -->
  <polyline points="140,129 131,131 134,122"
            fill="none" stroke="white" stroke-width="5"
            stroke-linecap="round" stroke-linejoin="round" opacity="0.88"/>

  <!-- Cluster node dots -->
  <circle cx="100" cy="52"  r="9" fill="white"/>
  <circle cx="72"  cy="116" r="9" fill="white"/>
  <circle cx="128" cy="116" r="9" fill="white"/>
  <!-- Inner accent dots (orange, hinting at Proxmox VMs) -->
  <circle cx="100" cy="52"  r="3.5" fill="#E57000"/>
  <circle cx="72"  cy="116" r="3.5" fill="#E57000"/>
  <circle cx="128" cy="116" r="3.5" fill="#E57000"/>

  <!-- Wordmark (dark text on light area below hex) -->
  <text x="100" y="196" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-weight="700" font-size="22" fill="#1a1a2e">NaSnap</text>
  <text x="100" y="218" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="9.5" fill="#555">NetApp Storage Manager for Proxmox</text>
</svg>
