<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 262" width="200" height="262">
  <!-- Concept 4: Blue/White/Black + Proxmox orange >< accent -->
  <!-- Server bars + snapshot arrow (C1 structure), dark badge, orange Proxmox mark -->

  <!-- Dark badge background -->
  <rect x="20" y="8" width="160" height="160" rx="34" fill="#141E30"/>

  <!-- Circular snapshot arrow — same geometry as C1 -->
  <path d="M 72 93 A 32 32 0 1 1 132 83"
        fill="none" stroke="white" stroke-width="8.5" stroke-linecap="round"/>
  <polyline points="138,74 132,83 124,77"
            fill="none" stroke="white" stroke-width="8.5"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Three server/volume bars (white) -->
  <rect x="34" y="117" width="132" height="14" rx="4" fill="white"/>
  <rect x="34" y="135" width="132" height="14" rx="4" fill="white" opacity="0.65"/>
  <rect x="34" y="153" width="132" height="14" rx="4" fill="white" opacity="0.38"/>

  <!-- Proxmox >< mark in orange — badge overlay, top-right corner of badge -->
  <!-- The Proxmox logo consists of two triangles pointing inward: >< -->
  <!-- Placed top-right of badge as an accent badge -->
  <circle cx="158" cy="36" r="16" fill="#E57000"/>
  <!-- Left triangle ">" pointing right: tip at right, open at left -->
  <polyline points="148,28 157,36 148,44"
            fill="none" stroke="white" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Right triangle "<" pointing left: tip at left, open at right -->
  <polyline points="163,28 154,36 163,44"
            fill="none" stroke="white" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- LED status dots on server bars -->
  <circle cx="151" cy="124" r="3.8" fill="#3B6CC7"/>
  <circle cx="161" cy="124" r="3.8" fill="#3B6CC7"/>
  <circle cx="151" cy="142" r="3.8" fill="#3B6CC7" opacity="0.8"/>
  <circle cx="161" cy="142" r="3.8" fill="#3B6CC7" opacity="0.8"/>

  <!-- Wordmark -->
  <text x="100" y="200" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-weight="700" font-size="22" fill="#e2e8f0">NaSnap</text>
  <text x="100" y="222" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="9" fill="#6b7280">Snapshot Management for Proxmox with NetApp Storage</text>
</svg>
