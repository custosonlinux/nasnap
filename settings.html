<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NaSnap — Settings</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1A252F;
      --surface:  #1F2D3A;
      --card:     #243542;
      --border:   #344955;
      --hover:    #2C3E50;
      --primary:  #005EB8;
      --primary-h:#0070D8;
      --text:     #E9ECEF;
      --muted:    #728B9A;
      --success:  #27AE60;
      --warning:  #F39C12;
      --error:    #E74C3C;
      --info:     #3498DB;
      --radius:   6px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Top bar ── */
    .topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 0 24px;
      height: 52px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }
    .topbar-brand {
      display: flex; align-items: center; gap: 10px;
      text-decoration: none; color: var(--text);
    }
    .topbar-brand svg { color: var(--primary); flex-shrink: 0; }
    .topbar-brand .brand-name { font-size: 15px; font-weight: 700; letter-spacing: .3px; }
    .topbar-sep { width: 1px; height: 20px; background: var(--border); }
    .topbar-title { font-size: 13px; font-weight: 600; }
    .topbar-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
    .btn-ghost {
      display: flex; align-items: center; gap: 6px;
      padding: 6px 12px; font-size: 12px; font-weight: 500;
      color: var(--muted); background: none;
      border: 1px solid var(--border); border-radius: var(--radius);
      cursor: pointer; text-decoration: none;
      transition: color .15s, border-color .15s, background .15s; white-space: nowrap;
    }
    .btn-ghost:hover { color: var(--text); border-color: var(--text); background: var(--hover); }

    /* ── Layout ── */
    .content {
      flex: 1;
      padding: 32px 24px;
      max-width: 760px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
    }
    .card-header {
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .card-header h2 { font-size: 13px; font-weight: 600; color: var(--text); }
    .card-header svg { color: var(--muted); flex-shrink: 0; }
    .card-body { padding: 20px; display: flex; flex-direction: column; gap: 0; }

    /* ── Profile header ── */
    .profile-row {
      display: flex; align-items: center; gap: 16px;
      padding-bottom: 20px; margin-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }
    .avatar-lg {
      width: 48px; height: 48px; border-radius: 50%;
      background: var(--primary);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 700; color: #fff; flex-shrink: 0;
    }
    .profile-info { display: flex; flex-direction: column; gap: 4px; }
    .profile-name { font-size: 16px; font-weight: 600; }
    .profile-meta { display: flex; align-items: center; gap: 8px; }
    .role-badge {
      display: inline-flex; align-items: center;
      padding: 2px 8px; border-radius: 10px;
      font-size: 11px; font-weight: 600;
    }
    .role-badge.admin  { background: rgba(0,94,184,.2); color: #49afd9; border: 1px solid rgba(0,94,184,.4); }
    .role-badge.viewer { background: rgba(114,139,154,.15); color: var(--muted); border: 1px solid var(--border); }
    .profile-date { font-size: 11px; color: var(--muted); }

    /* ── Settings rows ── */
    .settings-section-label {
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .7px;
      margin-bottom: 12px; margin-top: 4px;
    }
    .settings-section-label:not(:first-child) { margin-top: 24px; }
    .settings-row {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 16px; padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }
    .settings-row:last-child { border-bottom: none; }
    .settings-label { font-size: 13px; color: var(--text); font-weight: 500; flex-shrink: 0; min-width: 140px; }
    .settings-value { font-size: 13px; color: var(--muted); text-align: right; word-break: break-all; }
    .settings-value.mono { font-family: 'SF Mono', 'Consolas', monospace; font-size: 12px; }
    .badge-ok  { color: var(--success); }
    .badge-warn { color: var(--warning); }

    /* ── Password form ── */
    .pw-form { display: flex; flex-direction: column; gap: 14px; padding-top: 4px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 11px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .pw-wrap { position: relative; }
    .form-control {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: 13px; padding: 8px 36px 8px 10px;
      outline: none; transition: border-color .15s; width: 100%;
    }
    .form-control:focus { border-color: var(--primary); }
    .form-control::placeholder { color: var(--muted); }
    .pw-toggle {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--muted);
      display: flex; align-items: center; padding: 2px;
    }
    .pw-toggle:hover { color: var(--text); }
    .pw-footer { display: flex; align-items: center; gap: 12px; }
    .btn-primary {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 16px; font-size: 13px; font-weight: 600;
      color: #fff; background: var(--primary); border: none;
      border-radius: var(--radius); cursor: pointer; transition: background .15s;
    }
    .btn-primary:hover { background: var(--primary-h); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }
    .pw-msg { font-size: 12px; }
    .pw-msg.ok    { color: var(--success); }
    .pw-msg.error { color: var(--error); }

    /* ── Table (DB tables) ── */
    .db-table { width: 100%; border-collapse: collapse; font-size: 12px; margin-top: 4px; }
    .db-table th {
      text-align: left; padding: 7px 10px;
      font-size: 10px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .5px;
      border-bottom: 1px solid var(--border);
    }
    .db-table td { padding: 7px 10px; border-bottom: 1px solid var(--border); color: var(--muted); }
    .db-table tr:last-child td { border-bottom: none; }
    .db-table td:first-child { font-family: 'SF Mono', 'Consolas', monospace; color: var(--text); }
    .db-table td:last-child { text-align: right; color: var(--muted); }

    /* ── Toast ── */
    #toast {
      position: fixed; bottom: 24px; right: 24px; z-index: 2000;
      padding: 10px 16px; border-radius: var(--radius);
      font-size: 13px; font-weight: 500;
      opacity: 0; transform: translateY(8px);
      transition: opacity .2s, transform .2s; pointer-events: none;
    }
    #toast.show { opacity: 1; transform: translateY(0); }
    #toast.success { background: var(--success); color: #fff; }
    #toast.error   { background: var(--error);   color: #fff; }

    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid rgba(255,255,255,.3);
      border-top-color: #fff; border-radius: 50%;
      animation: spin .6s linear infinite; vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="topbar">
  <a class="topbar-brand" href="/">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
      <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>
    </svg>
    <span class="brand-name">NaSnap</span>
  </a>
  <div class="topbar-sep"></div>
  <span class="topbar-title">Settings</span>
  <div class="topbar-right">
    <a href="/" class="btn-ghost">
      <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
      Back to App
    </a>
    <button class="btn-ghost" onclick="logout()">
      <svg width="12" height="12" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Sign out
    </button>
  </div>
</div>

<div class="content">

  <!-- Profile & Password -->
  <div class="card">
    <div class="card-header">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/>
      </svg>
      <h2>Profile</h2>
    </div>
    <div class="card-body">
      <div class="profile-row">
        <div class="avatar-lg" id="avatar-initials">??</div>
        <div class="profile-info">
          <span class="profile-name" id="profile-username">—</span>
          <div class="profile-meta">
            <span id="profile-role-badge" class="role-badge">—</span>
            <span class="profile-date" id="profile-created">—</span>
          </div>
        </div>
      </div>

      <div class="settings-section-label">Change Password</div>
      <div class="pw-form">
        <div class="form-group">
          <label>Current Password</label>
          <div class="pw-wrap">
            <input id="pw-current" class="form-control" type="password" placeholder="Your current password" autocomplete="current-password">
            <button type="button" class="pw-toggle" onclick="togglePw('pw-current')">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>New Password</label>
          <div class="pw-wrap">
            <input id="pw-new" class="form-control" type="password" placeholder="Min. 6 characters" autocomplete="new-password">
            <button type="button" class="pw-toggle" onclick="togglePw('pw-new')">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-group">
          <label>Confirm New Password</label>
          <div class="pw-wrap">
            <input id="pw-confirm" class="form-control" type="password" placeholder="Repeat new password" autocomplete="new-password">
            <button type="button" class="pw-toggle" onclick="togglePw('pw-confirm')">
              <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="pw-footer">
          <button id="pw-btn" class="btn-primary" onclick="changePassword()">Update Password</button>
          <span id="pw-msg" class="pw-msg"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- System info (admin only) -->
  <div class="card" id="card-system" style="display:none">
    <div class="card-header">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
        <line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
      </svg>
      <h2>System</h2>
    </div>
    <div class="card-body">
      <div class="settings-row">
        <span class="settings-label">NaSnap Version</span>
        <span class="settings-value" id="sys-version">—</span>
      </div>
      <div class="settings-row">
        <span class="settings-label">Uptime</span>
        <span class="settings-value" id="sys-uptime">—</span>
      </div>
      <div class="settings-row">
        <span class="settings-label">Started</span>
        <span class="settings-value" id="sys-started">—</span>
      </div>
      <div class="settings-row">
        <span class="settings-label">Python</span>
        <span class="settings-value mono" id="sys-python">—</span>
      </div>
      <div class="settings-row">
        <span class="settings-label">Platform</span>
        <span class="settings-value" id="sys-platform">—</span>
      </div>
      <div class="settings-row">
        <span class="settings-label">Data Directory</span>
        <span class="settings-value mono" id="sys-datadir">—</span>
      </div>
      <div class="settings-row">
        <span class="settings-label">Debug Mode</span>
        <span class="settings-value" id="sys-debug">—</span>
      </div>
    </div>
  </div>

  <!-- Database (admin only) -->
  <div class="card" id="card-db" style="display:none">
    <div class="card-header">
      <svg width="14" height="14" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4.03 3 9 3s9-1.34 9-3V5"/>
        <path d="M3 12c0 1.66 4.03 3 9 3s9-1.34 9-3"/>
      </svg>
      <h2>Database</h2>
    </div>
    <div class="card-body">
      <div class="settings-row">
        <span class="settings-label">File</span>
        <span class="settings-value mono" id="db-path">—</span>
      </div>
      <div class="settings-row" style="border-bottom:1px solid var(--border);padding-bottom:16px;">
        <span class="settings-label">Size</span>
        <span class="settings-value" id="db-size">—</span>
      </div>
      <div style="margin-top:16px;">
        <table class="db-table">
          <thead><tr><th>Table</th><th style="text-align:right">Rows</th></tr></thead>
          <tbody id="db-tables"></tbody>
        </table>
      </div>
    </div>
  </div>

</div>

<div id="toast"></div>

<script>
function logout() {
  fetch('/api/auth/logout', { method: 'POST', credentials: 'include' })
    .finally(function() { window.location.replace('/login'); });
}

function togglePw(id) {
  var el = document.getElementById(id);
  el.type = el.type === 'password' ? 'text' : 'password';
}

function fmtDate(iso) {
  if (!iso) return '—';
  try {
    return new Date(iso).toLocaleDateString(undefined, {year:'numeric',month:'short',day:'numeric'});
  } catch(e) { return iso.substring(0,10); }
}

function fmtBytes(b) {
  if (b < 1024) return b + ' B';
  if (b < 1024*1024) return (b/1024).toFixed(1) + ' KB';
  return (b/(1024*1024)).toFixed(2) + ' MB';
}

// ── Load system info ──────────────────────────────────────────────────────────
fetch('/api/system/info', { credentials: 'include' })
  .then(function(r) {
    if (r.status === 401) { window.location.replace('/login'); return null; }
    return r.json();
  })
  .then(function(d) {
    if (!d) return;

    // Profile
    var initials = (d.username || '?').substring(0, 2).toUpperCase();
    document.getElementById('avatar-initials').textContent = initials;
    document.getElementById('profile-username').textContent = d.username || '—';
    var badge = document.getElementById('profile-role-badge');
    badge.textContent = d.role || '—';
    badge.className = 'role-badge ' + (d.role || '');
    document.getElementById('profile-created').textContent =
      d.created_at ? 'Member since ' + fmtDate(d.created_at) : '';

    if (d.role !== 'admin') return;

    // System card
    document.getElementById('card-system').style.display = '';
    document.getElementById('sys-version').textContent  = 'v' + d.version;
    document.getElementById('sys-uptime').textContent   = d.uptime;
    document.getElementById('sys-started').textContent  = fmtDate(d.started_at) + ' ' + (d.started_at ? d.started_at.substring(11,16) + ' UTC' : '');
    document.getElementById('sys-python').textContent   = d.python_version;
    document.getElementById('sys-platform').textContent = d.platform;
    document.getElementById('sys-datadir').textContent  = d.data_dir;
    var dbgEl = document.getElementById('sys-debug');
    dbgEl.textContent = d.debug ? 'Enabled' : 'Disabled';
    dbgEl.className = 'settings-value ' + (d.debug ? 'badge-warn' : 'badge-ok');

    // DB card
    document.getElementById('card-db').style.display = '';
    document.getElementById('db-path').textContent = d.db_path;
    document.getElementById('db-size').textContent = fmtBytes(d.db_size_bytes);

    var tbody = document.getElementById('db-tables');
    if (d.tables && d.tables.length) {
      tbody.innerHTML = d.tables.map(function(t) {
        return '<tr><td>' + esc(t.table) + '</td><td>' + t.rows + '</td></tr>';
      }).join('');
    } else {
      tbody.innerHTML = '<tr><td colspan="2" style="color:var(--muted)">No tables found</td></tr>';
    }
  });

// ── Change password ───────────────────────────────────────────────────────────
function changePassword() {
  var current = document.getElementById('pw-current').value;
  var newPw   = document.getElementById('pw-new').value;
  var confirm = document.getElementById('pw-confirm').value;
  var msgEl   = document.getElementById('pw-msg');
  var btn     = document.getElementById('pw-btn');

  msgEl.textContent = '';
  msgEl.className   = 'pw-msg';

  if (!current)           { showMsg('Current password is required.', 'error'); return; }
  if (newPw.length < 6)   { showMsg('New password must be at least 6 characters.', 'error'); return; }
  if (newPw !== confirm)  { showMsg('Passwords do not match.', 'error'); return; }

  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Saving…';

  fetch('/api/auth/me/password', {
    method: 'POST', credentials: 'include',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ current_password: current, new_password: newPw })
  }).then(function(r) { return r.json(); })
    .then(function(d) {
      btn.disabled = false;
      btn.textContent = 'Update Password';
      if (d.ok) {
        document.getElementById('pw-current').value = '';
        document.getElementById('pw-new').value     = '';
        document.getElementById('pw-confirm').value = '';
        showMsg('Password updated successfully.', 'ok');
        toast('Password updated', 'success');
      } else {
        showMsg(d.error || 'Failed to update password.', 'error');
      }
    })
    .catch(function() {
      btn.disabled = false;
      btn.textContent = 'Update Password';
      showMsg('Network error.', 'error');
    });
}

function showMsg(msg, type) {
  var el = document.getElementById('pw-msg');
  el.textContent = msg;
  el.className = 'pw-msg ' + type;
}

document.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && document.activeElement &&
      ['pw-current','pw-new','pw-confirm'].indexOf(document.activeElement.id) >= 0) {
    changePassword();
  }
});

// ── Helpers ───────────────────────────────────────────────────────────────────
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

var _toastTimer;
function toast(msg, type) {
  var el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show ' + (type || 'success');
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function() { el.className = ''; }, 3000);
}
</script>
</body>
</html>
