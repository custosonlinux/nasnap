<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 250" width="200" height="250">
  <!-- Concept 3: "DB Snapshot" — Database cylinder + snapshot ring, deep teal badge -->

  <!-- Badge background -->
  <rect x="20" y="8" width="160" height="160" rx="34" fill="#0E3D5C"/>

  <!-- Snapshot ring around cylinder — center (100,98), radius 50 -->
  <!-- Arc from SVG 130° to 50° clockwise (280° arc, gap at bottom) -->
  <!-- 130°: x=100+50*cos130°=67.9, y=98+50*sin130°=136.3 -->
  <!-- 50°:  x=100+50*cos50°=132.1, y=98+50*sin50°=136.3 -->
  <path d="M 68 136 A 50 50 0 1 1 132 136"
        fill="none" stroke="#4BA3C7" stroke-width="6" stroke-linecap="round"/>
  <!-- Arrowhead at (132,136): clockwise tangent at 50° = direction 140° -->
  <!-- Wings: (141,134) and (135,125) -->
  <polyline points="141,134 132,136 135,125"
            fill="none" stroke="#4BA3C7" stroke-width="6"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Database cylinder (NetApp ONTAP storage volumes) -->
  <!-- rx=36, top cap cy=68, bottom cap cy=128 -->

  <!-- Cylinder body sides -->
  <line x1="64" y1="68" x2="64" y2="128" stroke="white" stroke-width="3.5"/>
  <line x1="136" y1="68" x2="136" y2="128" stroke="white" stroke-width="3.5"/>

  <!-- Bottom cap (full ellipse — visible as base of cylinder) -->
  <ellipse cx="100" cy="128" rx="36" ry="10"
           fill="#0E3D5C" stroke="white" stroke-width="3.5"/>

  <!-- Volume layer dividers (top arcs of internal ellipses) -->
  <!-- At y=88: second volume layer -->
  <path d="M 64 88 A 36 10 0 0 1 136 88"
        fill="none" stroke="white" stroke-width="2.5" opacity="0.55"/>
  <!-- At y=108: third volume layer -->
  <path d="M 64 108 A 36 10 0 0 1 136 108"
        fill="none" stroke="white" stroke-width="2.5" opacity="0.35"/>

  <!-- Top cap (filled to cover cylinder body behind it) -->
  <ellipse cx="100" cy="68" rx="36" ry="10"
           fill="#0E3D5C" stroke="white" stroke-width="3.5"/>

  <!-- Wordmark -->
  <text x="100" y="200" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-weight="700" font-size="22" fill="#e2e8f0">NaSnap</text>
  <text x="100" y="222" text-anchor="middle"
        font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
        font-size="9.5" fill="#6b7280">NetApp Storage Manager for Proxmox</text>
</svg>
