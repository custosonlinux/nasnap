services:
  nasnap:
    build: .
    image: nasnap:latest
    # network_mode: host — the container binds directly to the host network.
    # This means the port configured in Settings → Server takes effect immediately
    # after a restart, without changing this file.
    # DNS is inherited from the host; add your internal DNS servers to
    # /etc/resolv.conf on the host if NetApp SVM resolution requires them.
    network_mode: host
    volumes:
      - /docker/nasnap/data:/data
      - /docker/nasnap/ssh:/root/.ssh
    environment:
      NASNAP_DATA: /data
      NASNAP_ADMIN_PASSWORD: "${NASNAP_ADMIN_PASSWORD:-admin}"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
      SESSION_HOURS: "8"
      TZ: "${TZ:-Europe/Berlin}"
      # DEBUG: "1"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "/healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
