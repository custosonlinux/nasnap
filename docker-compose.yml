services:
  nasnap:
    build: .
    image: nasnap:latest
    ports:
      - "5000:5000"
    volumes:
      - nasnap_data:/data
      - nasnap_ssh:/root/.ssh
    environment:
      NASNAP_ADMIN_PASSWORD: "${NASNAP_ADMIN_PASSWORD:-admin}"
      SECRET_KEY: "${SECRET_KEY:-change-me-in-production}"
      SESSION_HOURS: "8"
      # DEBUG: "1"
    dns:
      - 10.200.1.1
      - 10.200.1.2
      - 10.200.1.26
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/login')"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  nasnap_data:
  nasnap_ssh:
